name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # HACS installs what the tag points at, and Home Assistant reports the
      # manifest's version, so the two have to agree.
      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version custom_components/sungrow_modbus/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - name: Take the release notes from the changelog
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" \
            '/^## / { found = ($2 == version); next } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
